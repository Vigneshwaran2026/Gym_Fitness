
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Admin Dashboard</title>

<style>

    html, body {
    overflow-x: hidden;
    width: 100%;
}

:root {
    --Neon: #DEFB02;
    --Black: #000000;
    --Gray: #F6F6F6;
    --White: #FFFFFF;
    --Red: #F30A46;
    --Title: #111111;
    --Paragraph: #646464;
    --Border: #EAEAEA;
    --Green: #16834A;
    --SidebarWidth: 255px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--Gray);
    color: var(--Title);
    min-height: 100vh;
}

button, input, select { font: inherit; }
button { cursor: pointer; }
a { text-decoration: none; color: inherit; }

.app { min-height: 100vh; }

/* Sidebar */
.sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--SidebarWidth);
    background: var(--Black);
    color: var(--White);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    z-index: 100;
    overflow-y: auto;
    transition: transform .3s ease;
}


.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 58px;
    margin: 0 0 30px;
}

.brand-logo {
    display: block;
    width: 150px;
    height: 55px;
    object-fit: contain;
}

/* Mobile sizing */
@media (max-width: 480px) {
    .brand-logo {
        width: 125px;
        height: 45px;
    }
}


.brand-fallback {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 900;
}

.brand-mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--Neon);
    color: var(--Black);
}

.profile-mini {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 10px;
    margin-bottom: 22px;
    background: #171717;
    border: 1px solid #303030;
    border-radius: 13px;
}

.avatar {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--Black);
    background: var(--Neon);
    font-size: 15px;
    font-weight: 900;
}

.profile-mini strong {
    display: block;
    font-size: 13px;
    color: var(--White);
    overflow-wrap: anywhere;
}

.profile-mini .admin-role, .top-user .admin-role {
    display: block;
    color: var(--Neon);
    font-size: 11px;
    font-weight: 700;
    margin-top: 4px;
}

.profile-mini small {
    display: block;
    color: #a6a6a6;
    font-size: 11px;
    margin-top: 4px;
}

.nav-label {
    padding: 0 12px;
    margin: 8px 0 12px;
    color: #898989;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.sidebar-nav {
    display: grid;
    gap: 5px;
}

.nav-link {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 12px 13px;
    border: 0;
    border-radius: 9px;
    color: #bcbcbc;
    background: transparent;
    text-align: left;
    font-size: 13px;
    font-weight: 650;
    transition: .2s ease;
}

.nav-link .nav-icon {
    width: 23px;
    text-align: center;
    font-size: 17px;
}

.nav-link:hover {
    color: var(--White);
    background: #1e1e1e;
}

.nav-link.active {
    color: var(--Black);
    background: var(--Neon);
    box-shadow: 0 4px 15px rgba(222,251,2,.12);
}

.sidebar-bottom {
    margin-top: auto;
    padding-top: 24px;
}

.sidebar-bottom p {
    font-size: 11px;
    line-height: 1.7;
    color: #777;
    padding: 12px;
}

/* Main area */
.main {
    margin-left: var(--SidebarWidth);
    min-height: 100vh;
    min-width: 0;
}

.topbar {
    height: 82px;
    padding: 0 30px;
    background: var(--White);
    border-bottom: 1px solid var(--Border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.topbar-left, .topbar-right {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 0;
}

.page-heading h1 {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -.5px;
}

.page-heading p {
    margin-top: 4px;
    font-size: 12px;
    color: var(--Paragraph);
}

.menu-toggle {
    display: none;
    width: 40px;
    height: 40px;
    border: 1px solid var(--Border);
    border-radius: 9px;
    background: var(--White);
}

.search-box {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 260px;
    padding: 0 13px;
    height: 42px;
    border: 1px solid var(--Border);
    border-radius: 9px;
    background: #fafafa;
}

.search-box span { color: var(--Paragraph); }

.search-box input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 12px;
    color: var(--Title);
}

.top-user {
    display: flex;
    align-items: center;
    gap: 10px;
}

.top-user .avatar {
    width: 39px;
    height: 39px;
}

.top-user strong {
    display: block;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.top-user small {
    display: block;
    color: var(--Paragraph);
    font-size: 11px;
    margin-top: 3px;
}

.logout-btn {
    padding: 10px 13px;
    background: var(--White);
    border: 1px solid var(--Border);
    border-radius: 9px;
    color: var(--Red);
    font-size: 12px;
    font-weight: 800;
    transition: .2s;
}

.logout-btn:hover {
    background: var(--Red);
    border-color: var(--Red);
    color: var(--White);
}

/* Content */
.content {
    max-width: 1600px;
    margin: 0 auto;
    padding: 28px 30px 45px;
    animation: pageEnter .3s ease;
}

@keyframes pageEnter {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
}

.welcome-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
    padding: 29px 30px;
    margin-bottom: 25px;
    border-radius: 16px;
    background: var(--Black);
    color: var(--White);
    position: relative;
    overflow: hidden;
}

.welcome-banner::after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    right: 10%;
    top: -105px;
    border-radius: 50%;
    background: var(--Neon);
    opacity: .15;
}

.welcome-banner h2 {
    position: relative;
    z-index: 1;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 900;
    margin-bottom: 9px;
}

.welcome-banner p {
    position: relative;
    z-index: 1;
    color: #c2c2c2;
    font-size: 13px;
    line-height: 1.7;
}

.banner-tag {
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    padding: 11px 15px;
    border-radius: 9px;
    background: var(--Neon);
    color: var(--Black);
    font-size: 12px;
    font-weight: 900;
}

.section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin: 28px 0 17px;
}

.section-heading h2 {
    font-size: 17px;
    font-weight: 900;
}

.section-heading p {
    color: var(--Paragraph);
    font-size: 12px;
    margin-top: 5px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 17px;
}

.stat-card {
    padding: 20px;
    border-radius: 13px;
    border: 1px solid var(--Border);
    background: var(--White);
    transition: transform .25s, box-shadow .25s;
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 25px rgba(0,0,0,.05);
}

.stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 17px;
}

.stat-icon {
    display: grid;
    place-items: center;
    width: 41px;
    height: 41px;
    background: var(--Gray);
    border-radius: 11px;
    font-size: 19px;
}

.stat-change {
    color: var(--Green);
    font-size: 11px;
    font-weight: 800;
}

.stat-card h3 {
    font-size: 26px;
    letter-spacing: -1px;
    font-weight: 900;
}

.stat-card p {
    color: var(--Paragraph);
    font-size: 12px;
    margin-top: 5px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 18px;
    margin-top: 22px;
}

.panel {
    background: var(--White);
    border: 1px solid var(--Border);
    border-radius: 13px;
    padding: 22px;
    min-width: 0;
}

.panel-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.panel-heading h3 {
    font-size: 15px;
    font-weight: 900;
}

.panel-heading p {
    margin-top: 5px;
    font-size: 11px;
    color: var(--Paragraph);
}

.chart-legend {
    display: flex;
    gap: 14px;
    margin-bottom: 15px;
    font-size: 11px;
    color: var(--Paragraph);
}

.legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--Neon);
    margin-right: 5px;
}

.legend-dot.black { background: var(--Black); }

.bar-chart {
    height: 205px;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    gap: 12px;
    padding-top: 10px;
    border-bottom: 1px solid var(--Border);
    background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 48px,
        #ededed 49px,
        transparent 50px
    );
}

.bar-group {
    height: 100%;
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 5px;
}

.bar {
    width: min(25px, 40%);
    min-height: 6px;
    border-radius: 5px 5px 0 0;
    background: var(--Neon);
    animation: barGrow .7s ease both;
    transform-origin: bottom;
}

.bar.secondary { background: var(--Black); }

@keyframes barGrow {
    from { transform: scaleY(.15); }
    to { transform: scaleY(1); }
}

.chart-labels {
    display: flex;
    justify-content: space-around;
    gap: 10px;
    margin-top: 10px;
    font-size: 10px;
    color: var(--Paragraph);
}

.activity-list { display: grid; gap: 18px; }

.activity {
    display: flex;
    align-items: center;
    gap: 12px;
}

.activity-icon {
    width: 39px;
    height: 39px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--Gray);
    font-size: 17px;
}

.activity-info { min-width: 0; flex: 1; }

.activity-info strong {
    display: block;
    font-size: 12px;
}

.activity-info p {
    color: var(--Paragraph);
    font-size: 11px;
    margin-top: 4px;
}

.activity-time {
    color: var(--Paragraph);
    font-size: 10px;
    white-space: nowrap;
}

.table-panel {
    margin-top: 22px;
    padding: 22px;
    background: var(--White);
    border: 1px solid var(--Border);
    border-radius: 13px;
    overflow: hidden;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 570px;
}

th {
    padding: 13px 12px;
    background: #fafafa;
    color: var(--Paragraph);
    font-size: 10px;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: .7px;
}

td {
    padding: 15px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12px;
    vertical-align: middle;
}

tbody tr:last-child td { border-bottom: 0; }

.member-cell {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
}

.mini-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--Neon);
    color: var(--Black);
    font-size: 11px;
    font-weight: 900;
}

.status {
    display: inline-flex;
    align-items: center;
    padding: 6px 9px;
    border-radius: 30px;
    background: #f1f1f1;
    color: #555;
    font-size: 10px;
    font-weight: 800;
}

.status.active, .status.paid, .status.completed {
    color: #176b3b;
    background: #e8f7ed;
}

.status.pending {
    color: #8b5d00;
    background: #fff4d9;
}

.status.cancelled, .status.inactive {
    color: #a01d32;
    background: #ffebef;
}

/* Generic section cards */
.cards-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 17px;
}

.info-card {
    padding: 22px;
    border-radius: 13px;
    background: var(--White);
    border: 1px solid var(--Border);
    transition: transform .2s, box-shadow .2s;
}

.info-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(0,0,0,.05);
}

.info-card .card-icon {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    background: var(--Neon);
    border-radius: 12px;
    font-size: 20px;
    margin-bottom: 17px;
}

.info-card h3 {
    font-size: 15px;
    font-weight: 900;
    margin-bottom: 8px;
}

.info-card p {
    color: var(--Paragraph);
    font-size: 12px;
    line-height: 1.7;
}

.info-card .card-value {
    font-size: 25px;
    font-weight: 900;
    margin: 12px 0 6px;
}

.info-card .card-foot {
    font-size: 11px;
    color: var(--Paragraph);
    margin-top: 12px;
}

.btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    padding: 10px 13px;
    border: 1px solid var(--Black);
    border-radius: 8px;
    background: var(--Neon);
    color: var(--Black);
    font-size: 11px;
    font-weight: 900;
    transition: .2s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 0 var(--Black);
}

.btn-dark {
    background: var(--Black);
    color: var(--White);
    border-color: var(--Black);
}

.btn-outline {
    background: var(--White);
    color: var(--Black);
}

.btn-danger {
    background: var(--Red);
    color: var(--White);
    border-color: var(--Red);
}

.btn-small { padding: 7px 10px; }

.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.toolbar p {
    color: var(--Paragraph);
    font-size: 12px;
}

.toolbar-actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.progress-track {
    height: 8px;
    background: #eeeeee;
    border-radius: 30px;
    overflow: hidden;
    margin-top: 12px;
}

.progress-fill {
    height: 100%;
    width: var(--progress, 60%);
    background: var(--Neon);
    border-radius: 30px;
}

.empty-search {
    display: none;
    text-align: center;
    padding: 35px 15px;
    color: var(--Paragraph);
    font-size: 13px;
}

.search-hidden { display: none !important; }

/* Settings */
.settings-form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.settings-field label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 800;
}

.settings-field input,
.settings-field select {
    width: 100%;
    height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--Border);
    border-radius: 8px;
    outline: none;
    background: var(--White);
}

.settings-field input:focus,
.settings-field select:focus {
    border-color: var(--Black);
    box-shadow: 0 0 0 3px rgba(222,251,2,.5);
}

.settings-note {
    color: var(--Paragraph);
    font-size: 12px;
    line-height: 1.7;
    margin-top: 18px;
}

/* Responsive */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 90;
}

@media (max-width: 1200px) {
    .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dashboard-grid { grid-template-columns: 1fr; }
}

@media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .overlay.show { display: block; }
    .main { margin-left: 0; }
    .menu-toggle { display: block; }
    .topbar { padding: 0 20px; }
    .content { padding: 22px 20px 35px; }
    .search-box { width: 220px; }
}

@media (max-width: 620px) {
    .topbar {
        min-height: 75px;
        height: auto;
        padding: 13px 15px;
        flex-wrap: wrap;
    }

    .topbar-left { flex: 1; }
    .page-heading h1 { font-size: 17px; }
    .page-heading p { display: none; }
    .topbar-right { width: 100%; justify-content: space-between; }
    .search-box { flex: 1; width: auto; }
    .top-user .user-details { display: none; }
    .logout-btn { padding: 9px 10px; }
    .content { padding: 18px 14px 30px; }
    .welcome-banner { padding: 22px; align-items: flex-start; }
    .banner-tag { display: none; }
    .stats-grid, .cards-grid { grid-template-columns: 1fr 1fr; gap: 11px; }
    .stat-card, .info-card { padding: 15px; }
    .stat-card h3 { font-size: 22px; }
    .stat-card p { line-height: 1.5; }
    .panel, .table-panel { padding: 16px; }
    .settings-form { grid-template-columns: 1fr; }
}

@media (max-width: 390px) {
    .stats-grid, .cards-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}


/* Sidebar scrollbar */
.sidebar {
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--Neon) var(--Black);
}

/* Chrome, Edge, and Safari */
.sidebar::-webkit-scrollbar {
    width: 7px;
}

.sidebar::-webkit-scrollbar-track {
    background: var(--Black);
    border-radius: 10px;
}

.sidebar::-webkit-scrollbar-thumb {
    background: var(--Neon);
    border-radius: 10px;
    border: 1px solid var(--Black);
}

.sidebar::-webkit-scrollbar-thumb:hover {
    background: var(--Gray);
}

/* Smooth scrolling */
.sidebar {
    scroll-behavior: smooth;
}


</style>
</head>

<body>
<div class="app">

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
       
<a href="index.html" class="brand" aria-label="Back to home">
    <img
        src="image/logo/logo.webp"
        alt="Logo"
        class="brand-logo"
        id="sidebarLogo"
    >
</a>


        <div class="profile-mini">
            <div class="avatar user-initials">A</div>
            <div>
                <strong class="username-display">Fitness Admin</strong>
                <small class="email-display">Email not available</small>
            </div>
        </div>

        <div class="nav-label">Main Menu</div>

        <nav class="sidebar-nav" id="sidebarNav">
            <button class="nav-link active" data-page="dashboard">
                <span class="nav-icon">▦</span> Dashboard
            </button>
            <button class="nav-link" data-page="members">
                <span class="nav-icon">♙</span> Members
            </button>
            <button class="nav-link" data-page="trainers">
                <span class="nav-icon">🏋</span> Trainers
            </button>
            <button class="nav-link" data-page="classes">
                <span class="nav-icon">▤</span> Fitness Classes
            </button>
            <button class="nav-link" data-page="schedule">
                <span class="nav-icon">▦</span> Schedule
            </button>
            <button class="nav-link" data-page="nutrition">
                <span class="nav-icon">♧</span> Nutrition Plans
            </button>
            <button class="nav-link" data-page="payments">
                <span class="nav-icon">＄</span> Payments
            </button>
            <button class="nav-link" data-page="reports">
                <span class="nav-icon">▥</span> Reports
            </button>

            <div class="nav-label" style="margin-top:20px;">System</div>

            <button class="nav-link" data-page="settings">
                <span class="nav-icon">⚙</span> Settings
            </button>
        </nav>

        <div class="sidebar-bottom">
            <button class="nav-link" id="sidebarLogout">
                <span class="nav-icon">↪</span> Logout
            </button>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle"
                    aria-label="Open navigation">☰</button>
                <div class="page-heading">
                    <h1 id="pageTitle">Dashboard Overview</h1>
                    <p id="pageSubtitle">Monitor your fitness center performance</p>
                </div>
            </div>

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function (ch) {
            return ({

                '"': "&quot;", "'": "&#39;"
            })[ch];
        });
    }

    function renderPage(page) {

        pageSubtitle.textContent = meta[1];

        document.querySelectorAll(".nav-link[data-page]").forEach(function (link) {
            link.classList.toggle("active", link.dataset.page === page);
        });

        pageContent.innerHTML = templates[page]();
        search.value = "";

        sidebar.classList.remove("open");
        overlay.classList.remove("show");

        // Attach section-specific demo interactions.
        const settingsLogout = document.getElementById("settingsLogout");
        if (settingsLogout) settingsLogout.addEventListener("click", logout);

        const settingsForm = document.getElementById("settingsForm");
        if (settingsForm) {
            settingsForm.addEventListener("submit", function (event) {
                event.preventDefault();
            });

    // Search filters visible records and cards on the active page.

        const query = search.value.trim().toLowerCase();
        const items = pageContent.querySelectorAll(".searchable");
        let visible = 0;

        items.forEach(function (item) {
            const matches = item.textContent.toLowerCase().includes(query);
            item.classList.toggle("search-hidden", !matches);
            if (matches) visible++;
        });

        pageContent.querySelectorAll(".table-panel").forEach(function (panel) {
            const rows = panel.querySelectorAll("tbody tr.searchable");
            const empty = panel.querySelector(".empty-search");
            if (empty && rows.length) {
                const shownRows = Array.from(rows).filter(row =>
                    !row.classList.contains("search-hidden")
                ).length;
                empty.style.display = shownRows === 0 ? "block" : "none";
            }
        });

        let emptyMessage = pageContent.querySelector("#globalEmptySearch");
        if (!emptyMessage) {
            emptyMessage = document.createElement("div");
            emptyMessage.id = "globalEmptySearch";
            emptyMessage.className = "panel";
            emptyMessage.style.cssText = "display:none;text-align:center;margin-top:20px;color:#646464;";
            emptyMessage.textContent = "No matching content found on this page.";
            pageContent.appendChild(emptyMessage);
        }

        emptyMessage.style.display = query && visible === 0 ? "block" : "none";
    }

    function logout() {
        // Demo logout: clear the session username and return to login.
        sessionStorage.removeItem("loginUsername");
        sessionStorage.removeItem("username");
        sessionStorage.removeItem("loginEmail");
        sessionStorage.removeItem("loginRole");
        window.location.href = "login.html";
    }

    document.getElementById("sidebarNav").addEventListener("click", function (event) {
        const button = event.target.closest("[data-page]");
        if (!button) return;
        renderPage(button.dataset.page);
    });

    // All action buttons in the dashboard open the site's 404 page.
    pageContent.addEventListener("click", function (event) {
        const button = event.target.closest(".go-404");
        if (!button) return;
        window.location.href = "404.html";
    });

    search.addEventListener("input", runSearch);

    document.getElementById("topLogout").addEventListener("click", logout);
    document.getElementById("sidebarLogout").addEventListener("click", logout);

    document.getElementById("menuToggle").addEventListener("click", function () {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");
    });

    overlay.addEventListener("click", function () {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
    });

    renderPage("dashboard");
});
</script>

</body>
</html>
